[package]
name = "zappeqc"
version = "0.1.0"
description = "ZappeQc — chaînes québécoises en direct, via les lecteurs officiels"
authors = ["ZappeQc"]
edition = "2024"

[lib]
# The `_lib` suffix is necessary to keep the lib name unique from the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "zappeqc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` est requis pour créer des webviews enfants (multi-webview) dans une fenêtre.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
